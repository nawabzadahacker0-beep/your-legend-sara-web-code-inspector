<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Legend sara - Obfuscated Secure Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-shadow: 0 0 5px #00ff66;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #0a0a0a;
            border: 1px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #000000;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 4px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 255, 102, 0.2);
        }

        textarea:focus {
            box-shadow: 0 0 8px #00ff66;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #00ff66;
            color: #000000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00cc52;
            box-shadow: 0 0 15px #00ff66;
        }

        .output-group {
            margin-top: 25px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Your Legend Sara</h1>

        <div class="input-group">
            <label for="inputCode">Enter Code To Secure:</label>
            <textarea id="inputCode" placeholder="Paste your HTML/JS code here..."></textarea>
        </div>

        <button onclick="encryptCode()">Obfuscate & Secure</button>

        <div class="output-group">
            <label for="outputCode">Encrypted Secure Code Output:</label>
            <textarea id="outputCode" readonly placeholder="Secured code will appear here..."></textarea>
        </div>

        <div class="footer">
            Powered by Your Legend
        </div>
    </div>

    <script>
        function encryptCode() {
            var input = document.getElementById('inputCode').value;
            if (!input) {
                alert('Please enter some code to obfuscate!');
                return;
            }

            var charCodes = [];
            for (var i = 0; i < input.length; i++) {
                charCodes.push(input.charCodeAt(i) + 13); 
            }

            var result = "<script>\n" +
                "(function(){\n" +
                "   var _q = [" + charCodes.join(",") + "];\n" +
                "   var _s = '';\n" +
                "   for(var i=0; i<_q.length; i++) {\n" +
                "       _s += String.fromCharCode(_q[i] - 13);\n" +
                "   }\n" +
                "   document.write(_s);\n" +
                "})();\n" +
                "<\/script>";

            document.getElementById('outputCode').value = result;
        }
    </script>
</body>
</html>

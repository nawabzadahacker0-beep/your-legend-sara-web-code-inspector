<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Legend Sara</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0f12;
            color: #e1e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-weight: 600;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #6e7681;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #0d1117;
            border-left: 4px solid #58a6ff;
            border-radius: 4px;
            text-align: left;
            font-size: 13px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Your Legend Sara</h1>
        <p>Bypass & Security Operations Panel</p>

        <form id="bypassForm" onsubmit="return false;">
            <div class="input-group">
                <label for="targetUrl">Target URL / Host:</label>
                <input type="text" id="targetUrl" placeholder="Enter target URL..." required>
            </div>

            <div class="input-group">
                <label for="modeSelect">Select Method:</label>
                <select id="modeSelect">
                    <option value="bypass_v1">Bypass Method 1 (Fast)</option>
                    <option value="bypass_v2">Bypass Method 2 (Secure)</option>
                    <option value="direct">Direct Tunnel</option>
                </select>
            </div>

            <button type="button" onclick="executeProcess()">Execute Action</button>
        </form>

        <div id="statusResult" class="status-box" style="display: none;">
            <strong>Status:</strong> <span id="statusText">Ready</span>
        </div>

        <div class="footer">
            Powered by Your Legend Sara &copy; 2026. All Rights Reserved.
        </div>
    </div>

    <script>
        function executeProcess() {
            var url = document.getElementById('targetUrl').value;
            var mode = document.getElementById('modeSelect').value;
            var statusBox = document.getElementById('statusResult');
            var statusText = document.getElementById('statusText');

            if (!url) {
                alert('Please enter a valid target URL.');
                return;
            }

            statusBox.style.display = 'block';
            statusText.innerHTML = 'Processing request for <strong>' + url + '</strong> using <em>' + mode + '</em>...';

            setTimeout(function() {
                statusText.innerHTML = '<span style="color: #3fb950;">[SUCCESS]</span> Request processed by Your Legend Sara engine.';
            }, 1500);
        }
    </script>
</body>
</html>
